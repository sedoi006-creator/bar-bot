name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Check Telegram connectivity
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "=== python ==="; python -V
          echo "=== telegram lib ==="; python -c "import telegram; print(telegram.__version__)"
          echo "=== getMe ==="
          python - <<'EOF'
          import os, urllib.request, json
          tok = os.environ["BOT_TOKEN"]
          try:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{tok}/getMe", timeout=20) as r:
                  print("OK:", r.read().decode()[:200])
          except Exception as e:
              print("FAIL:", type(e).__name__, e)
          EOF
      - name: Try bot import and start (5 sec)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== импорт bot.py ==="
          timeout 12 python -X utf8 -u -c "
          import bot
          print('bot.py импортирован успешно, рецептов:', len(bot.RECIPES))
          print('токен найден:', bool(bot.load_token()))
          " || echo "импорт прерван/ошибка (код $?)"
